services:
  - type: web
    name: secretvault-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m cloudserver.main
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SV_ALLOWED_ORIGINS
        sync: false
      - key: SV_FRONTEND_URL
        sync: false
      - key: SV_BUCKET_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: SV_ADMIN_CLAIM_HASH
        sync: false
